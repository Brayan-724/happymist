[package]
name = "happymist"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["2d", "audio", "debug", "jpeg", "ui"] }
bevy-inspector-egui = { version = "0.38.0", default-features = false, features = ["2d", "bevy"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
pretty_assertions = "1.4.1"
